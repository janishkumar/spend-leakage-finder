name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.14"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src app tests
      - name: Test (no network; synthetic fixtures)
        run: uv run pytest --cov=leakage --cov-report=term-missing --cov-fail-under=85
      - name: Dependency audit (advisory)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > requirements.lock.txt
          uvx pip-audit --progress-spinner off -r requirements.lock.txt \
            || echo "::warning::pip-audit reported vulnerable dependencies"

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: spend-leakage-finder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
