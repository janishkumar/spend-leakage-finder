[project]
name = "spend-leakage-finder"
version = "0.1.0"
description = "Find duplicate payments, vendor-master duplicates and split purchases in an AP payments ledger."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "pandera>=0.20",
    "requests>=2.32",
    "openpyxl>=3.1",
    "streamlit>=1.38",
    "altair>=5.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
leakage = "leakage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leakage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
